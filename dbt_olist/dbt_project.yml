name: "dbt_olist"
version: "1.0.0"
config-version: 2

profile: "dbt_olist"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  dbt_olist:
    staging:
      +materialized: view
      +schema: raw_olist_staging
    marts:
      +materialized: incremental
      +incremental_strategy: merge
      +schema: raw_olist_marts
      +on_schema_change: sync_all_columns
      # Propriedades Iceberg aplicadas globalmente a todos os marts
      # Alinhado com docs/solucao.md seção 8.4
      +table_properties:
        format: "'PARQUET'"
        partitioning: "ARRAY['month(order_date)']"
