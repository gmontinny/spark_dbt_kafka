version: 2

models:

  - name: stg_orders
    description: "Pedidos limpos, tipados e desduplicados por kafka_offset — Camada Silver."
    columns:
      - name: order_id
        description: "Chave primária do pedido."
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - invoiced
                - processing
                - created
                - approved
                - unavailable
      - name: order_purchased_at
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: is_delivered
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: stg_customers
    description: "Clientes desduplicados por customer_unique_id — Camada Silver."
    columns:
      - name: customer_id
        description: "Identificador do cliente neste pedido."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Identidade real do cliente (pode ter múltiplos customer_ids)."
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
          - accepted_values:
              values:
                - AC - AL - AM - AP - BA - CE - DF - ES - GO - MA
                - MG - MS - MT - PA - PB - PE - PI - PR - RJ - RN
                - RO - RR - RS - SC - SE - SP - TO

  - name: stg_order_items
    description: "Itens de pedido desduplicados por (order_id, order_item_id) — Camada Silver."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: freight_value
        tests:
          - not_null
      - name: total_item_value
        tests:
          - not_null

  - name: stg_order_payments
    description: "Pagamentos desduplicados por (order_id, payment_sequential) — Camada Silver."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_sequential
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined
      - name: payment_installments
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: stg_products
    description: "Produtos enriquecidos com categoria em inglês — Camada Silver."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_category_name_en
        tests:
          - not_null

  - name: stg_sellers
    description: "Vendedores normalizados e desduplicados — Camada Silver."
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: seller_state
        tests:
          - not_null
