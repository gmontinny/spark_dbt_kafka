version: 2

models:

  - name: fct_orders
    description: >
      Tabela fato de pedidos (Gold / Iceberg). Granularidade: 1 linha por order_id.
      Agrega pagamentos e itens, calcula SLA de entrega e flag de pontualidade.
      Particionada por month(order_date) para pruning eficiente no Trino.
    columns:
      - name: order_id
        description: "Chave primária — identificador único do pedido."
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - invoiced
                - processing
                - created
                - approved
                - unavailable
      - name: order_date
        tests:
          - not_null
      - name: is_delivered
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: delivered_on_time
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: total_payment_value
        tests:
          - not_null
      - name: payment_count
        tests:
          - not_null
      - name: total_items
        tests:
          - not_null
      - name: total_order_value
        tests:
          - not_null
      - name: dbt_updated_at
        tests:
          - not_null

  - name: dim_customers
    description: >
      Dimensão de clientes (Gold / Iceberg). Granularidade: 1 linha por customer_unique_id.
      Consolida métricas de LTV, recência e comportamento de compra.
    columns:
      - name: customer_unique_id
        description: "Chave primária — identidade real do cliente."
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
      - name: total_orders
        tests:
          - not_null
      - name: lifetime_value
        tests:
          - not_null
      - name: avg_order_value
        tests:
          - not_null
      - name: delivered_orders
        tests:
          - not_null
      - name: dbt_updated_at
        tests:
          - not_null

  - name: dim_sellers
    description: >
      Dimensão de vendedores (Gold / Iceberg). Granularidade: 1 linha por seller_id.
      Agrega métricas de performance: receita, volume e variedade de produtos.
    columns:
      - name: seller_id
        description: "Chave primária — identificador único do vendedor."
        tests:
          - unique
          - not_null
      - name: seller_state
        tests:
          - not_null
      - name: total_orders
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: avg_item_price
        tests:
          - not_null
      - name: dbt_updated_at
        tests:
          - not_null
